<!DOCTYPE html>
<html>

<head>
  <title>Checkout</title>

  <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- this for the frofile image icon the camara -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Load a font called Roboto from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Here are the CSS files for this page. -->
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/image-profile.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
  <link rel="shortcut icon" href="images/jamal-compiler-mobile-logo.png" type="image/x-icon">

</head>


      

<body>
  <div class="checkout-header">
    <div class="header-content">
      <div class="checkout-header-left-section">
     
       <div class="circle">
          <img class="profile-pic"
            src="https://t3.ftcdn.net/jpg/03/46/83/96/360_F_346839683_6nAPzbhpSkIpb8pmAwufkC7c5eD7wYws.jpg">
        <div class="p-image">
          <i class="fa fa-camera upload-button"></i>
          <input class="file-upload" type="file" accept="image/*" style="display: none;" />
        </div>
      </div>
        <a href="index.html">
        <img class="jamal-compiler-logo" src="images/jamal-compiler-logo.png">
        <img class="jamal-compiler-mobile-logo" src="images/jamal-compiler-mobile-logo.png">
      </a>
    </div>

 
    <div class="checkout-header-middle-section">
      Checkout (<a class="return-to-home-link js-return-to-home-link" href="index.html">0 items</a>)
    </div>

    <div class="checkout-header-right-section">
      <img src="images/icons/checkout-lock-icon.png">
    </div>
  </div>

  </div>

  <div class="main">
    <div class="page-title">Review your order</div>

    <div class="checkout-grid">
      <div class="order-summary js-order-summary">

      </div>

      <div class="payment-summary js-payment-summary">

      </div>
    </div>
  </div>

  <script type="module" src="scripts/checkout.js"></script>
</body>

</html>
